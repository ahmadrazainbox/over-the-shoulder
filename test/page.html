<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Over the Shoulder test page</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 40px; max-width: 720px; }
    section { margin: 0 0 32px; }
    button, input, select { font: inherit; padding: 6px 10px; }
    #far { margin-left: 360px; }
    iframe { width: 100%; height: 120px; border: 1px solid #ccc; }
    /* A fixed width, so the hop between the two fields stays short with any system font. */
    #pair input { width: 50px; box-sizing: border-box; margin: 0; }
  </style>
</head>
<body>
  <h1>Over the Shoulder test page</h1>

  <section>
    <h2>Buttons</h2>
    <button id="save">Save</button>
    <button id="far">Far button</button>
    <a id="link" href="#details">Details link</a>
  </section>

  <section>
    <h2>Form</h2>
    <label>Name <input id="name" autocomplete="off"></label>
    <label>Notes <textarea id="notes" rows="2"></textarea></label>
    <label>Status
      <select id="status"><option>Open</option><option>Closed</option></select>
    </label>
  </section>

  <section>
    <h2>Shadow DOM</h2>
    <shadow-card id="card"></shadow-card>
  </section>

  <section>
    <h2>Single-page navigation</h2>
    <button id="nav">Go to /next without a reload</button>
    <p id="where"></p>
  </section>

  <section>
    <h2>Iframe</h2>
    <iframe id="frame" title="Inner frame" src="frame.html"></iframe>
  </section>

  <section id="pair">
    <h2>Neighbouring fields</h2>
    <input id="first" aria-label="First name"><input id="last" aria-label="Last name">
  </section>

  <section>
    <h2>Dialog</h2>
    <button id="open-dialog">Open dialog</button>
    <dialog id="dialog"><p>A modal dialog</p><button id="dialog-ok">OK</button></dialog>
  </section>

  <section>
    <h2>Text a person typed (never logged)</h2>
    <ul><li id="row">Row <span id="edit" contenteditable="true">typed in a row</span></li></ul>
    <table><tr><td id="cell">Cell <div contenteditable="true">typed in a cell</div></td></tr></table>
    <span id="code-label">Code</span>
    <input id="code" aria-labelledby="code-label code" value="prefilled value">
    <label>Comment <textarea id="comment">prefilled comment</textarea></label>
    <input id="qty1" aria-label="Qty" size="4"><input id="qty2" aria-label="Qty" size="4">
    <!-- A code editor's shape: keys go to a hidden textarea, typed text is drawn into plain spans. -->
    <div id="editor"><textarea aria-label="Editor input" style="position:absolute;opacity:0;width:1px;height:1px"></textarea><pre><span id="code-line">const apiKey = 'sk-typed-in-editor'</span></pre></div>
    <div id="aria-box" role="textbox" title="typed into title">typed into an aria textbox</div>
  </section>

  <script>
    customElements.define('shadow-card', class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = '<div style="padding:12px;border:1px solid #ccc;width:320px">'
          + '<p>Inside a shadow root</p><button id="inner">Inner button</button></div>';
      }
    });
    document.getElementById('nav').onclick = () => {
      history.pushState({}, '', location.pathname.replace(/[^/]*$/, 'next'));
      document.getElementById('where').textContent = 'Now at ' + location.pathname;
    };
    document.getElementById('open-dialog').onclick = () => document.getElementById('dialog').showModal();
  </script>
</body>
</html>
