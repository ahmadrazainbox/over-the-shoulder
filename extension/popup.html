<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Over the Shoulder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/32.png" alt="" width="20" height="20">
    <h1>Over the Shoulder</h1>
  </header>

  <section>
    <h2>This site</h2>
    <p id="site-name" class="site"></p>
    <p id="site-status" class="muted"></p>
    <button id="site-action" type="button" hidden></button>
  </section>

  <section>
    <h2>Enabled sites</h2>
    <p class="muted">Always on: localhost, 127.0.0.1 and *.test.</p>
    <ul id="sites"></ul>
  </section>

  <section>
    <h2>Voice</h2>
    <label class="row"><input id="voice" type="checkbox"> Speak each step</label>
    <label class="field">Voice
      <select id="voice-name"><option value="">System default</option></select>
    </label>
    <p id="voice-note" class="muted" hidden>Online voices send the spoken text to Google to be read aloud.</p>
    <label class="field">Speed <span id="rate-value"></span>
      <input id="rate" type="range" min="0.5" max="2" step="0.1">
    </label>
    <label class="field">New step
      <select id="mode">
        <option value="interrupt">Interrupts the last one</option>
        <option value="queue">Waits for the last one</option>
      </select>
    </label>
    <button id="test-voice" type="button">Test voice</button>
  </section>

  <section>
    <h2>Display</h2>
    <label class="row"><input id="show-mine" type="checkbox"> Also show my own clicks</label>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
